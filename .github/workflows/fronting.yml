name: Fronting regression tests

on:
  push:
    branches: [fronting-ws]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/fronting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
      - name: WebSocket and config regression tests
        run: go test -race ./transport/internet/websocket ./infra/conf/v4 -count=1 -timeout=5m
